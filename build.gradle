plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.0'
}

group = 'org.weather-forecast'
version = '1.0.0'

java {

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("com.squareup.retrofit2:retrofit:3.0.0")
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation("org.projectlombok:lombok:1.18.48")
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    implementation("ch.qos.logback:logback-classic:1.6.3")
    implementation 'org.slf4j:jul-to-slf4j:2.0.18'

    implementation("com.squareup.okhttp3:logging-interceptor:5.5.0")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    exclude('weather.properties')
    exclude('logback.xml')
}

shadowJar {
    manifest {
        attributes(
                'Main-Class': 'org.weather.WeatherForecast',
                'Class-Path': '. config/'
        )
    }
}

application {
    mainClass = 'org.weather.WeatherForecast'
}

test {
    useJUnitPlatform()
}